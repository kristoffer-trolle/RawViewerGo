plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rawviewergo'
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.rawviewergo"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    // Release signing reads from <repo root>/keystore.properties (gitignored, never committed).
    // Without that file, assembleRelease still works but produces an unsigned APK.
    def keystorePropsFile = rootProject.file('keystore.properties')
    signingConfigs {
        if (keystorePropsFile.exists()) {
            def keystoreProps = new Properties()
            keystorePropsFile.withInputStream { keystoreProps.load(it) }
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'

    testImplementation 'junit:junit:4.13.2'
}

// Copies the debug APK out to <repo root>/build/RawViewerGo.apk after every debug build,
// so there's always a stable, easy-to-find path for sideloading onto a phone.
tasks.register('copyApkToBuildFolder', Copy) {
    from("$buildDir/outputs/apk/debug/app-debug.apk")
    into("$rootDir/build")
    rename { "RawViewerGo.apk" }
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        finalizedBy('copyApkToBuildFolder')
    }
}
